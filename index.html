<!DOCTYPE html>
<html>
<head>
    <title>Mini Operating System</title>
    <style>
        body {
            font-family: monospace;
        }
        #terminal {
            width: 80%;
            height: 400px;
            border: 1px solid black;
            padding: 10px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <h1>Mini Operating System</h1>
    <div id="terminal"></div>
    <input id="command" type="text" placeholder="Enter command" />
    <button id="execute">Execute</button>
    <script>
        let terminal = document.getElementById("terminal");
        let commandInput = document.getElementById("command");
        let executeButton = document.getElementById("execute");
        let commands = {
            "help": "Available commands: help, ls, mkdir, rm, cd",
            "ls": "List of files and directories: file1.txt, file2.txt, directory1",
            "mkdir": "Create a new directory",
            "rm": "Remove a file or directory",
            "cd": "Change directory"
        };
        executeButton.addEventListener("click", function() {
            let command = commandInput.value;
            if (commands[command]) {
                terminal.innerHTML += command + "\n" + commands[command] + "\n";
            } else {
                terminal.innerHTML += command + "\n" + "Unknown command" + "\n";
            }
            commandInput.value = "";
        });
        commandInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                executeButton.click();
            }
        });
        terminal.innerHTML += "Welcome to the mini operating system\n";
        terminal.innerHTML += "Type 'help' for available commands\n";
    </script>
</body>
</html>
